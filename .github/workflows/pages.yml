name: Build firmware and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Test portal tooling
        run: python -m unittest discover -s tests -v
      - name: Test firmware policy
        run: pio test -d firmware/ble-mqtt-scanner -e native
      - name: Build ESP32-C6 firmware
        run: pio run -d firmware/ble-mqtt-scanner -e esp32-c6-devkitc-1
      - name: Assemble static portal
        run: >-
          python scripts/build_site.py
          --firmware-build firmware/ble-mqtt-scanner/.pio/build/esp32-c6-devkitc-1
          --output _site
          --version "$(tr -d '\n\r ' < VERSION)"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
