name: Build firmware and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Test portal tooling
        run: python -m unittest discover -s tests -v
      - name: Verify wiring diagrams are reproducible
        run: |
          python scripts/generate_wiring_diagrams.py
          git diff --exit-code -- web/wiring
          test -z "$(git status --porcelain -- web/wiring)"
      - name: Test BLE scanner policy
        run: pio test -d firmware/ble-mqtt-scanner -e native
      - name: Test no-hardware lab policy
        run: >-
          g++ -std=c++17
          -I firmware/no-hardware-lab/include
          firmware/no-hardware-lab/src/lab_logic.cpp
          firmware/no-hardware-lab/test/native/test_main.cpp
          -o /tmp/no-hardware-lab-tests
          && /tmp/no-hardware-lab-tests
      - name: Test BME280 sensor configuration policy
        run: >-
          g++ -std=c++17
          -I firmware/bme280-mqtt-sensor/include
          firmware/bme280-mqtt-sensor/src/sensor_config_logic.cpp
          firmware/bme280-mqtt-sensor/test/native/test_main.cpp
          -o /tmp/bme280-config-tests
          && /tmp/bme280-config-tests
      - name: Test hardware lab policy
        run: >-
          g++ -std=c++17
          -I firmware/hardware-lab/include
          firmware/hardware-lab/src/hardware_logic.cpp
          firmware/hardware-lab/test/native/test_main.cpp
          -o /tmp/hardware-lab-tests
          && /tmp/hardware-lab-tests
      - name: Test NTP clock display formatting
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -I firmware/common -I firmware/hardware-lab/include
          firmware/hardware-lab/src/ntp_clock_display.cpp
          firmware/hardware-lab/test/clock_native/test_main.cpp
          -o /tmp/ntp-clock-display-tests
          && /tmp/ntp-clock-display-tests
      - name: Test Pico lab policy
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -I firmware/pico-lab/include
          firmware/pico-lab/src/pico_logic.cpp
          firmware/pico-lab/test/native/test_main.cpp
          -o /tmp/pico-lab-tests
          && /tmp/pico-lab-tests
      - name: Test ESP32 diagnostics policy
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -I firmware/esp32-diagnostics/include
          firmware/esp32-diagnostics/src/diagnostics_logic.cpp
          firmware/esp32-diagnostics/test/native/test_main.cpp
          -o /tmp/esp32-diagnostics-tests
          && /tmp/esp32-diagnostics-tests
      - name: Test LCD1602 panel policy
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -I firmware/common -I firmware/lcd-panels/include
          firmware/lcd-panels/src/panel_logic.cpp
          firmware/lcd-panels/test/native/test_main.cpp
          -o /tmp/lcd-panel-tests
          && /tmp/lcd-panel-tests
      - name: Test LCD1602 dashboard scheduling
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -I firmware/lcd-panels/include
          firmware/lcd-panels/src/dashboard_logic.cpp
          firmware/lcd-panels/test/dashboard_native/test_main.cpp
          -o /tmp/dashboard-tests
          && /tmp/dashboard-tests
      - name: Build BLE scanner firmware
        run: pio run -d firmware/ble-mqtt-scanner
      - name: Build no-hardware firmware collection
        run: pio run -d firmware/no-hardware-lab
      - name: Build BME280 MQTT sensor firmware
        run: pio run -d firmware/bme280-mqtt-sensor
      - name: Build hardware lab firmware
        run: pio run -d firmware/hardware-lab
      - name: Build Raspberry Pi Pico firmware
        run: pio run -d firmware/pico-lab
      - name: Build ESP32 diagnostics firmware
        run: pio run -d firmware/esp32-diagnostics
      - name: Build LCD1602 network panel firmware
        run: pio run -d firmware/lcd-panels
      - name: Enforce LCD1602 dashboard stack budget
        run: |
          for environment in smart-dashboard--esp32 smart-dashboard--esp32-c3 smart-dashboard--esp32-s3 smart-dashboard--esp32-c6; do
            python scripts/check_dashboard_stack.py "firmware/lcd-panels/.pio/build/$environment/src/dashboard_config.cpp.su"
          done
      - name: Test LCD1602 space response contract
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -I firmware/lcd-panels/include
          -I firmware/lcd-panels/.pio/libdeps/smart-dashboard--esp32/ArduinoJson/src
          firmware/lcd-panels/src/dashboard_space.cpp
          firmware/lcd-panels/test/dashboard_space_native/test_main.cpp
          -o /tmp/dashboard-space-tests
          && /tmp/dashboard-space-tests
      - name: Assemble static portal
        run: python scripts/build_site.py --output _site
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
