<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1056" role="img" aria-labelledby="title desc">
<title id="title">NTP Desk Clock wiring for ESP32-C3-DevKitM-1</title>
<desc id="desc">Fritzing-inspired board and breadboard diagram. LCD1602 VCC to 5V; LCD1602 GND to GND; LCD1602 SDA to GPIO4 through bidirectional I2C level shifter (HV1 to LV1); LCD1602 SCL to GPIO5 through bidirectional I2C level shifter (HV2 to LV2); Level shifter HV to 5V; Level shifter LV to 3V3; Level shifter GND to GND.</desc>
