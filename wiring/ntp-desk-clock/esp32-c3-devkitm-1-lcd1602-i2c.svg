<text x="70" y="874" class="section">ELECTRICAL NOTES</text><text x="70" y="906" class="warning" data-full="The Inland KS0061 LCD is a 5 V module. Use the documented bidirectional I2C level shifter with LV at 3.3 V; never connect 5 V SDA/SCL pull-ups directly to ESP32 GPIO.">⚠ The Inland KS0061 LCD is a 5 V module. Use the documented bidirectional I2C level shifter with LV at 3.3</text><text x="70" y="930" class="warning" data-full="">  V; never connect 5 V SDA/SCL pull-ups directly to ESP32 GPIO.</text><text x="70" y="954" class="warning" data-full="The scan reports possible responders only. PCF8574 has no device ID, so display writes remain restricted to the explicitly configured address 0x27.">⚠ The scan reports possible responders only. PCF8574 has no device ID, so display writes remain restricted</text><text x="70" y="978" class="warning" data-full="">  to the explicitly configured address 0x27.</text><text x="70" y="1002" class="warning" data-full="Wiring, voltage behavior, address, and LCD operation are not yet physically verified on the named board.">⚠ Wiring, voltage behavior, address, and LCD operation are not yet physically verified on the named board.</text>
