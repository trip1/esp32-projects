[platformio]
default_envs =
  diagnostics--esp32
  diagnostics--esp32-c3
  diagnostics--esp32-s3
  diagnostics--esp32-c6

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
lib_deps = bblanchon/ArduinoJson@7.4.2
build_src_filter = +<main.cpp> +<diagnostics_logic.cpp>

[env:diagnostics--esp32]
extends = base
board = esp32dev
build_flags = ${base.build_flags} -DDIAG_SDA_PIN=21 -DDIAG_SCL_PIN=22 -DDIAG_SPI_SCK_PIN=18 -DDIAG_SPI_MISO_PIN=19 -DDIAG_SPI_MOSI_PIN=23 -DDIAG_SPI_SS_PIN=5 -DSETUP_BUTTON_PIN=0

[env:diagnostics--esp32-c3]
extends = base
board = esp32-c3-devkitm-1
build_flags = ${base.build_flags} -DDIAG_SDA_PIN=4 -DDIAG_SCL_PIN=5 -DDIAG_SPI_SCK_PIN=4 -DDIAG_SPI_MISO_PIN=5 -DDIAG_SPI_MOSI_PIN=6 -DDIAG_SPI_SS_PIN=7 -DSETUP_BUTTON_PIN=9

[env:diagnostics--esp32-s3]
extends = base
board = esp32-s3-devkitc-1
build_flags = ${base.build_flags} -DDIAG_SDA_PIN=8 -DDIAG_SCL_PIN=9 -DDIAG_SPI_SCK_PIN=12 -DDIAG_SPI_MISO_PIN=13 -DDIAG_SPI_MOSI_PIN=11 -DDIAG_SPI_SS_PIN=10 -DSETUP_BUTTON_PIN=0

[env:diagnostics--esp32-c6]
extends = base
board = esp32-c6-devkitc-1
build_flags = ${base.build_flags} -DDIAG_SDA_PIN=6 -DDIAG_SCL_PIN=7 -DDIAG_SPI_SCK_PIN=21 -DDIAG_SPI_MISO_PIN=20 -DDIAG_SPI_MOSI_PIN=19 -DDIAG_SPI_SS_PIN=18 -DSETUP_BUTTON_PIN=9

[env:native]
platform = native
test_build_src = yes
build_src_filter = +<diagnostics_logic.cpp>
