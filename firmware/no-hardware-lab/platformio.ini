[platformio]
default_envs =
  wifi-surveyor--esp32
  wifi-surveyor--esp32-c3
  wifi-surveyor--esp32-s3
  wifi-surveyor--esp32-c6
  rgb-lamp--esp32-c3
  rgb-lamp--esp32-s3
  rgb-lamp--esp32-c6
  device-console--esp32
  device-console--esp32-c3
  device-console--esp32-s3
  device-console--esp32-c6
  ble-presence-beacon--esp32
  ble-presence-beacon--esp32-c3
  ble-presence-beacon--esp32-s3
  ble-presence-beacon--esp32-c6
  decision-oracle--esp32
  decision-oracle--esp32-c3
  decision-oracle--esp32-s3
  decision-oracle--esp32-c6
  pomodoro-light--esp32-c3
  pomodoro-light--esp32-s3
  pomodoro-light--esp32-c6
  morse-beacon--esp32-c3
  morse-beacon--esp32-s3
  morse-beacon--esp32-c6
  ble-alias-shuffler--esp32
  ble-alias-shuffler--esp32-c3
  ble-alias-shuffler--esp32-s3
  ble-alias-shuffler--esp32-c6
  littlefs-dropbox--esp32
  littlefs-dropbox--esp32-c3
  littlefs-dropbox--esp32-s3
  littlefs-dropbox--esp32-c6
  local-chat-room--esp32
  local-chat-room--esp32-c3
  local-chat-room--esp32-s3
  local-chat-room--esp32-c6
  ble-uart-console--esp32
  ble-uart-console--esp32-c3
  ble-uart-console--esp32-s3
  ble-uart-console--esp32-c6
  boot-counter--esp32
  boot-counter--esp32-c3
  boot-counter--esp32-s3
  boot-counter--esp32-c6
  cpu-benchmark--esp32
  cpu-benchmark--esp32-c3
  cpu-benchmark--esp32-s3
  cpu-benchmark--esp32-c6
  ibeacon-lab--esp32
  ibeacon-lab--esp32-c3
  ibeacon-lab--esp32-s3
  ibeacon-lab--esp32-c6

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags = -std=gnu++17
build_unflags = -std=gnu++11

[board-esp32]
board = esp32dev

[board-esp32-c3]
board = esp32-c3-devkitm-1

[board-esp32-s3]
board = esp32-s3-devkitc-1

[board-esp32-c6]
board = esp32-c6-devkitc-1

[app-wifi-surveyor]
build_src_filter = -<*> +<app_support.cpp> +<apps/wifi-surveyor.cpp>

[app-rgb-lamp]
build_src_filter = -<*> +<app_support.cpp> +<apps/rgb-lamp.cpp>

[app-device-console]
build_src_filter = -<*> +<app_support.cpp> +<apps/device-console.cpp>

[app-ble-presence-beacon]
build_src_filter = -<*> +<lab_logic.cpp> +<apps/ble-presence-beacon.cpp>
lib_deps = h2zero/NimBLE-Arduino@2.5.1

[app-decision-oracle]
build_src_filter = -<*> +<app_support.cpp> +<lab_logic.cpp> +<apps/decision-oracle.cpp>

[app-pomodoro-light]
build_src_filter = -<*> +<lab_logic.cpp> +<apps/pomodoro-light.cpp>

[app-morse-beacon]
build_src_filter = -<*> +<lab_logic.cpp> +<apps/morse-beacon.cpp>

[app-ble-alias-shuffler]
build_src_filter = -<*> +<lab_logic.cpp> +<apps/ble-alias-shuffler.cpp>
lib_deps = h2zero/NimBLE-Arduino@2.5.1

[app-littlefs-dropbox]
build_src_filter = -<*> +<app_support.cpp> +<lab_logic.cpp> +<apps/littlefs-dropbox.cpp>

[app-local-chat-room]
build_src_filter = -<*> +<app_support.cpp> +<lab_logic.cpp> +<apps/local-chat-room.cpp>
lib_deps = links2004/WebSockets@2.7.3

[app-ble-uart-console]
build_src_filter = -<*> +<lab_logic.cpp> +<apps/ble-uart-console.cpp>
lib_deps = h2zero/NimBLE-Arduino@2.5.1

[app-boot-counter]
build_src_filter = -<*> +<app_support.cpp> +<apps/boot-counter.cpp>

[app-cpu-benchmark]
build_src_filter = -<*> +<app_support.cpp> +<apps/cpu-benchmark.cpp>

[app-ibeacon-lab]
build_src_filter = -<*> +<lab_logic.cpp> +<apps/ibeacon-lab.cpp>
lib_deps = h2zero/NimBLE-Arduino@2.5.1

[env:wifi-surveyor--esp32]
extends = board-esp32, app-wifi-surveyor

