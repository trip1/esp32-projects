[platformio]
default_envs =
  wifi-surveyor
  rgb-lamp
  device-console
  ble-presence-beacon
  decision-oracle
  pomodoro-light
  morse-beacon
  ble-alias-shuffler

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags = -std=gnu++17
build_unflags = -std=gnu++11

[web-app]
build_src_filter = -<*> +<app_support.cpp> +<apps/${PIOENV}.cpp>

[led-app]
build_src_filter = -<*> +<lab_logic.cpp> +<apps/${PIOENV}.cpp>

[ble-app]
build_src_filter = -<*> +<lab_logic.cpp> +<apps/${PIOENV}.cpp>
lib_deps = h2zero/NimBLE-Arduino@2.5.1

[env:wifi-surveyor]
extends = web-app

[env:rgb-lamp]
extends = web-app

[env:device-console]
extends = web-app

[env:decision-oracle]
extends = web-app
build_src_filter = -<*> +<app_support.cpp> +<lab_logic.cpp> +<apps/${PIOENV}.cpp>

[env:pomodoro-light]
extends = led-app

[env:morse-beacon]
extends = led-app

[env:ble-presence-beacon]
extends = ble-app

[env:ble-alias-shuffler]
extends = ble-app
