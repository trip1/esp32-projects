[platformio]
default_envs =
  sensor--esp32
  sensor--esp32-c3
  sensor--esp32-s3
  sensor--esp32-c6

[firmware]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit BME280 Library@2.3.0
  adafruit/Adafruit Unified Sensor@1.1.15
  knolleary/PubSubClient@2.8.0
  bblanchon/ArduinoJson@7.4.3
build_flags =
  -std=gnu++17
build_unflags =
  -std=gnu++11

[env:sensor--esp32]
extends = firmware
board = esp32dev
build_flags =
  ${firmware.build_flags}
  -D SENSOR_SDA_PIN=21
  -D SENSOR_SCL_PIN=22
  -D SETUP_BUTTON_PIN=0

[env:sensor--esp32-c3]
extends = firmware
board = esp32-c3-devkitm-1
build_flags =
  ${firmware.build_flags}
  -D SENSOR_SDA_PIN=4
  -D SENSOR_SCL_PIN=5
  -D SETUP_BUTTON_PIN=9

[env:sensor--esp32-s3]
extends = firmware
board = esp32-s3-devkitc-1
build_flags =
  ${firmware.build_flags}
  -D SENSOR_SDA_PIN=8
  -D SENSOR_SCL_PIN=9
  -D SETUP_BUTTON_PIN=0

[env:sensor--esp32-c6]
extends = firmware
board = esp32-c6-devkitc-1
build_flags =
  ${firmware.build_flags}
  -D SENSOR_SDA_PIN=6
  -D SENSOR_SCL_PIN=7
  -D SETUP_BUTTON_PIN=9

[env:native]
platform = native
build_src_filter = +<sensor_config_logic.cpp> -<main.cpp>
