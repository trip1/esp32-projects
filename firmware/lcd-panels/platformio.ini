[platformio]
default_envs =
  mqtt-home-status--esp32
  mqtt-home-status--esp32-c3
  mqtt-home-status--esp32-s3
  mqtt-home-status--esp32-c6
  unifi-network--esp32
  unifi-network--esp32-c3
  unifi-network--esp32-s3
  unifi-network--esp32-c6
  space-satellite--esp32
  space-satellite--esp32-c3
  space-satellite--esp32-s3
  space-satellite--esp32-c6
  wifi-weather--esp32
  wifi-weather--esp32-c3
  wifi-weather--esp32-s3
  wifi-weather--esp32-c6
  smart-dashboard--esp32
  smart-dashboard--esp32-c3
  smart-dashboard--esp32-s3
  smart-dashboard--esp32-c6

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17 -I../common
build_unflags = -std=gnu++11
lib_deps =
  bblanchon/ArduinoJson@7.4.3
build_src_filter = +<*> -<dashboard_main.cpp> -<dashboard_config.cpp> -<dashboard_logic.cpp> -<dashboard_space.cpp>

[dashboard]
build_src_filter = +<*> -<main.cpp> -<panel_config.cpp> -<bounded_mqtt.cpp>
build_flags = -fstack-usage

[board-esp32]
board = esp32dev
build_flags = ${base.build_flags} -DPANEL_SDA_PIN=21 -DPANEL_SCL_PIN=22 -DPANEL_LCD_ADDRESS=0x27 -DSETUP_BUTTON_PIN=0
[board-esp32-c3]
board = esp32-c3-devkitm-1
build_flags = ${base.build_flags} -DPANEL_SDA_PIN=4 -DPANEL_SCL_PIN=5 -DPANEL_LCD_ADDRESS=0x27 -DSETUP_BUTTON_PIN=9
[board-esp32-s3]
board = esp32-s3-devkitc-1
build_flags = ${base.build_flags} -DPANEL_SDA_PIN=8 -DPANEL_SCL_PIN=9 -DPANEL_LCD_ADDRESS=0x27 -DSETUP_BUTTON_PIN=0
[board-esp32-c6]
board = esp32-c6-devkitc-1
build_flags = ${base.build_flags} -DPANEL_SDA_PIN=6 -DPANEL_SCL_PIN=7 -DPANEL_LCD_ADDRESS=0x27 -DSETUP_BUTTON_PIN=9

[env:mqtt-home-status--esp32]
extends = base, board-esp32
build_flags = ${base.build_flags} -DPANEL_SDA_PIN=21 -DPANEL_SCL_PIN=22 -DPANEL_LCD_ADDRESS=0x27 -DSETUP_BUTTON_PIN=0 -DPANEL_KIND=1
[env:mqtt-home-status--esp32-c3]
extends = base, board-esp32-c3
build_flags = ${base.build_flags} -DPANEL_SDA_PIN=4 -DPANEL_SCL_PIN=5 -DPANEL_LCD_ADDRESS=0x27 -DSETUP_BUTTON_PIN=9 -DPANEL_KIND=1
[env:mqtt-home-status--esp32-s3]
extends = base, board-esp32-s3
build_flags = ${base.build_flags} -DPANEL_SDA_PIN=8 -DPANEL_SCL_PIN=9 -DPANEL_LCD_ADDRESS=0x27 -DSETUP_BUTTON_PIN=0 -DPANEL_KIND=1
[env:mqtt-home-status--esp32-c6]
extends = base, board-esp32-c6
build_flags = ${base.build_flags} -DPANEL_SDA_PIN=6 -DPANEL_SCL_PIN=7 -DPANEL_LCD_ADDRESS=0x27 -DSETUP_BUTTON_PIN=9 -DPANEL_KIND=1

[env:unifi-network--esp32]
extends = base, board-esp32
build_flags = ${base.build_flags} -DPANEL_SDA_PIN=21 -DPANEL_SCL_PIN=22 -DPANEL_LCD_ADDRESS=0x27 -DSETUP_BUTTON_PIN=0 -DPANEL_KIND=2
[env:unifi-network--esp32-c3]
extends = base, board-esp32-c3
build_flags = ${base.build_flags} -DPANEL_SDA_PIN=4 -DPANEL_SCL_PIN=5 -DPANEL_LCD_ADDRESS=0x27 -DSETUP_BUTTON_PIN=9 -DPANEL_KIND=2
[env:unifi-network--esp32-s3]
extends = base, board-esp32-s3
build_flags = ${base.build_flags} -DPANEL_SDA_PIN=8 -DPANEL_SCL_PIN=9 -DPANEL_LCD_ADDRESS=0x27 -DSETUP_BUTTON_PIN=0 -DPANEL_KIND=2
[env:unifi-network--esp32-c6]
extends = base, board-esp32-c6
build_flags = ${base.build_flags} -DPANEL_SDA_PIN=6 -DPANEL_SCL_PIN=7 -DPANEL_LCD_ADDRESS=0x27 -DSETUP_BUTTON_PIN=9 -DPANEL_KIND=2

[env:space-satellite--esp32]
extends = base, board-esp32
build_flags = ${base.build_flags} -DPANEL_SDA_PIN=21 -DPANEL_SCL_PIN=22 -DPANEL_LCD_ADDRESS=0x27 -DSETUP_BUTTON_PIN=0 -DPANEL_KIND=3
[env:space-satellite--esp32-c3]
extends = base, board-esp32-c3
build_flags = ${base.build_flags} -DPANEL_SDA_PIN=4 -DPANEL_SCL_PIN=5 -DPANEL_LCD_ADDRESS=0x27 -DSETUP_BUTTON_PIN=9 -DPANEL_KIND=3
[env:space-satellite--esp32-s3]
extends = base, board-esp32-s3
build_flags = ${base.build_flags} -DPANEL_SDA_PIN=8 -DPANEL_SCL_PIN=9 -DPANEL_LCD_ADDRESS=0x27 -DSETUP_BUTTON_PIN=0 -DPANEL_KIND=3
[env:space-satellite--esp32-c6]
extends = base, board-esp32-c6
build_flags = ${base.build_flags} -DPANEL_SDA_PIN=6 -DPANEL_SCL_PIN=7 -DPANEL_LCD_ADDRESS=0x27 -DSETUP_BUTTON_PIN=9 -DPANEL_KIND=3

[env:wifi-weather--esp32]
extends = base, board-esp32
build_flags = ${base.build_flags} -DPANEL_SDA_PIN=21 -DPANEL_SCL_PIN=22 -DPANEL_LCD_ADDRESS=0x27 -DSETUP_BUTTON_PIN=0 -DPANEL_KIND=4
[env:wifi-weather--esp32-c3]
extends = base, board-esp32-c3
build_flags = ${base.build_flags} -DPANEL_SDA_PIN=4 -DPANEL_SCL_PIN=5 -DPANEL_LCD_ADDRESS=0x27 -DSETUP_BUTTON_PIN=9 -DPANEL_KIND=4
[env:wifi-weather--esp32-s3]
extends = base, board-esp32-s3
build_flags = ${base.build_flags} -DPANEL_SDA_PIN=8 -DPANEL_SCL_PIN=9 -DPANEL_LCD_ADDRESS=0x27 -DSETUP_BUTTON_PIN=0 -DPANEL_KIND=4
[env:wifi-weather--esp32-c6]
extends = base, board-esp32-c6
build_flags = ${base.build_flags} -DPANEL_SDA_PIN=6 -DPANEL_SCL_PIN=7 -DPANEL_LCD_ADDRESS=0x27 -DSETUP_BUTTON_PIN=9 -DPANEL_KIND=4

[env:smart-dashboard--esp32]
extends = base, board-esp32, dashboard
build_flags = ${base.build_flags} ${dashboard.build_flags} -DPANEL_SDA_PIN=21 -DPANEL_SCL_PIN=22 -DPANEL_LCD_ADDRESS=0x27 -DSETUP_BUTTON_PIN=0 -DPANEL_KIND=5
[env:smart-dashboard--esp32-c3]
extends = base, board-esp32-c3, dashboard
build_flags = ${base.build_flags} ${dashboard.build_flags} -DPANEL_SDA_PIN=4 -DPANEL_SCL_PIN=5 -DPANEL_LCD_ADDRESS=0x27 -DSETUP_BUTTON_PIN=9 -DPANEL_KIND=5
[env:smart-dashboard--esp32-s3]
extends = base, board-esp32-s3, dashboard
build_flags = ${base.build_flags} ${dashboard.build_flags} -DPANEL_SDA_PIN=8 -DPANEL_SCL_PIN=9 -DPANEL_LCD_ADDRESS=0x27 -DSETUP_BUTTON_PIN=0 -DPANEL_KIND=5
[env:smart-dashboard--esp32-c6]
extends = base, board-esp32-c6, dashboard
build_flags = ${base.build_flags} ${dashboard.build_flags} -DPANEL_SDA_PIN=6 -DPANEL_SCL_PIN=7 -DPANEL_LCD_ADDRESS=0x27 -DSETUP_BUTTON_PIN=9 -DPANEL_KIND=5
