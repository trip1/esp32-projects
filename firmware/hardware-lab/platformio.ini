[platformio]
default_envs =
  hc-sr04-parking--esp32
  hc-sr04-parking--esp32-c3
  hc-sr04-parking--esp32-s3
  hc-sr04-parking--esp32-c6
  pir-occupancy--esp32
  pir-occupancy--esp32-c3
  pir-occupancy--esp32-s3
  pir-occupancy--esp32-c6
  ntp-desk-clock--esp32
  ntp-desk-clock--esp32-c3
  ntp-desk-clock--esp32-s3
  ntp-desk-clock--esp32-c6
  ntp-desk-clock-lcd1602--esp32
  ntp-desk-clock-lcd1602--esp32-c3
  ntp-desk-clock-lcd1602--esp32-s3
  ntp-desk-clock-lcd1602--esp32-c6

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17 -I../common
build_unflags = -std=gnu++11

[board-esp32]
board = esp32dev

[board-esp32-c3]
board = esp32-c3-devkitm-1

[board-esp32-s3]
board = esp32-s3-devkitc-1

[board-esp32-c6]
board = esp32-c6-devkitc-1

[parking]
build_src_filter = -<*> +<hardware_logic.cpp> +<hardware_portal.cpp> +<apps/hc-sr04-parking.cpp>

[pir]
build_src_filter = -<*> +<hardware_logic.cpp> +<hardware_portal.cpp> +<apps/pir-occupancy.cpp>

[clock]
build_src_filter = -<*> +<hardware_logic.cpp> +<ntp_clock_config.cpp> +<ntp_clock_display.cpp> +<apps/ntp-desk-clock.cpp>
lib_deps = https://github.com/avishorp/TM1637.git#3cca19607013c49f6708b7f492765fea835431ca

[clock-lcd1602]
build_src_filter = -<*> +<hardware_logic.cpp> +<ntp_clock_config.cpp> +<ntp_clock_display.cpp> +<apps/ntp-desk-clock.cpp>

[env:hc-sr04-parking--esp32]
extends = base, board-esp32, parking
build_flags = ${base.build_flags} -DTRIGGER_PIN=25 -DECHO_PIN=26
[env:hc-sr04-parking--esp32-c3]
extends = base, board-esp32-c3, parking
build_flags = ${base.build_flags} -DTRIGGER_PIN=4 -DECHO_PIN=5
[env:hc-sr04-parking--esp32-s3]
extends = base, board-esp32-s3, parking
build_flags = ${base.build_flags} -DTRIGGER_PIN=4 -DECHO_PIN=5
[env:hc-sr04-parking--esp32-c6]
extends = base, board-esp32-c6, parking
build_flags = ${base.build_flags} -DTRIGGER_PIN=6 -DECHO_PIN=7

[env:pir-occupancy--esp32]
extends = base, board-esp32, pir
build_flags = ${base.build_flags} -DPIR_PIN=27
[env:pir-occupancy--esp32-c3]
extends = base, board-esp32-c3, pir
build_flags = ${base.build_flags} -DPIR_PIN=4
[env:pir-occupancy--esp32-s3]
extends = base, board-esp32-s3, pir
build_flags = ${base.build_flags} -DPIR_PIN=4
[env:pir-occupancy--esp32-c6]
extends = base, board-esp32-c6, pir
build_flags = ${base.build_flags} -DPIR_PIN=6

[env:ntp-desk-clock--esp32]
extends = base, board-esp32, clock
build_flags = ${base.build_flags} -DCLOCK_CLK_PIN=18 -DCLOCK_DIO_PIN=19 -DSETUP_BUTTON_PIN=0
[env:ntp-desk-clock--esp32-c3]
extends = base, board-esp32-c3, clock
build_flags = ${base.build_flags} -DCLOCK_CLK_PIN=4 -DCLOCK_DIO_PIN=5 -DSETUP_BUTTON_PIN=9
[env:ntp-desk-clock--esp32-s3]
extends = base, board-esp32-s3, clock
build_flags = ${base.build_flags} -DCLOCK_CLK_PIN=4 -DCLOCK_DIO_PIN=5 -DSETUP_BUTTON_PIN=0
[env:ntp-desk-clock--esp32-c6]
extends = base, board-esp32-c6, clock
build_flags = ${base.build_flags} -DCLOCK_CLK_PIN=6 -DCLOCK_DIO_PIN=7 -DSETUP_BUTTON_PIN=9

[env:ntp-desk-clock-lcd1602--esp32]
extends = base, board-esp32, clock-lcd1602
build_flags = ${base.build_flags} -DCLOCK_DISPLAY_LCD1602=1 -DCLOCK_SDA_PIN=21 -DCLOCK_SCL_PIN=22 -DCLOCK_LCD_ADDRESS=0x27 -DSETUP_BUTTON_PIN=0
[env:ntp-desk-clock-lcd1602--esp32-c3]
extends = base, board-esp32-c3, clock-lcd1602
build_flags = ${base.build_flags} -DCLOCK_DISPLAY_LCD1602=1 -DCLOCK_SDA_PIN=4 -DCLOCK_SCL_PIN=5 -DCLOCK_LCD_ADDRESS=0x27 -DSETUP_BUTTON_PIN=9
[env:ntp-desk-clock-lcd1602--esp32-s3]
extends = base, board-esp32-s3, clock-lcd1602
build_flags = ${base.build_flags} -DCLOCK_DISPLAY_LCD1602=1 -DCLOCK_SDA_PIN=8 -DCLOCK_SCL_PIN=9 -DCLOCK_LCD_ADDRESS=0x27 -DSETUP_BUTTON_PIN=0
[env:ntp-desk-clock-lcd1602--esp32-c6]
extends = base, board-esp32-c6, clock-lcd1602
build_flags = ${base.build_flags} -DCLOCK_DISPLAY_LCD1602=1 -DCLOCK_SDA_PIN=6 -DCLOCK_SCL_PIN=7 -DCLOCK_LCD_ADDRESS=0x27 -DSETUP_BUTTON_PIN=9

[env:native]
platform = native
test_build_src = yes
build_src_filter = +<hardware_logic.cpp>
