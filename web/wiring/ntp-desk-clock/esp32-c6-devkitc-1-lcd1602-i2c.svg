<text x="70" y="615" class="section">CONNECTIONS</text><circle cx="72" cy="645" r="6" fill="#e53935"/><text x="88" y="650" class="connection">LCD1602 VCC → 3V3</text><circle cx="72" cy="672" r="6" fill="#20252b"/><text x="88" y="677" class="connection">LCD1602 GND → GND</text><circle cx="72" cy="699" r="6" fill="#2e7d32"/><text x="88" y="704" class="connection">LCD1602 SDA → GPIO6</text><circle cx="72" cy="726" r="6" fill="#f9a825"/><text x="88" y="731" class="connection">LCD1602 SCL → GPIO7</text>
<text x="70" y="758" class="section">ELECTRICAL NOTES</text><text x="70" y="790" class="warning">⚠ Use only a 3.3 V-compatible LCD/backpack when connecting VCC directly to 3.3 V; display contrast and backlight must work at that voltage.</text><text x="70" y="817" class="warning">⚠ Many PCF8574 backpacks pull SDA and SCL up to VCC. If the module requires 5 V, add a bidirectional I²C level shifter and never expose ESP32 GPIO to 5 V pull-ups.</text><text x="70" y="844" class="warning">⚠ This prebuilt variant uses I²C address 0x27. For a 0x3F backpack, build locally with CLOCK_LCD_ADDRESS changed after confirming the address.</text><text x="70" y="871" class="warning">⚠ Wiring and LCD behavior are not yet physically verified.</text>
