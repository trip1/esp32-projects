<title id="title">NTP Desk Clock wiring for ESP32-C6-DevKitC-1</title>
<desc id="desc">Fritzing-inspired board and breadboard diagram. LCD1602 VCC to 3V3; LCD1602 GND to GND; LCD1602 SDA to GPIO6; LCD1602 SCL to GPIO7.</desc>
